name: Python

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: PATH="$PATH:/usr/games" pytest -q
