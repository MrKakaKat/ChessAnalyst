name: Flutter

# Тесты — на каждый пуш и PR. Сборка APK и веб-версии и релиз — только по
# тегу версии (v1.0, v1.1, ...) или вручную (Run workflow с номером версии:
# тег создаётся сам), чтобы не тратить минуты на каждый коммит.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0); empty: tests only"
        required: false
        default: ""

env:
  FLUTTER_VERSION: "3.47.9"

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests (the Dart analysis is checked against Python)
        run: flutter test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Только arm64-v8a: все современные телефоны. Номер сборки выше, чем у
      # тестовых сборок старого репозитория (~150): APK встаёт обновлением.
      - name: Build APK
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name "${TAG#v}" --build-number $((1000 + GITHUB_RUN_NUMBER))
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/ChessAnalyst-arm64-v8a.apk
      # WebAssembly: dartchess использует 64-битные целые, которых нет в dart2js.
      - name: Build web (wasm)
        run: |
          flutter build web --wasm --release --no-web-resources-cdn --no-tree-shake-icons
          (cd build/web && zip -qr /tmp/ChessAnalyst-web.zip .)
      - name: Publish the release
        working-directory: .
        run: |
          gh release create "$TAG" /tmp/ChessAnalyst-arm64-v8a.apk /tmp/ChessAnalyst-web.zip \
            --target "$GITHUB_SHA" --title "ChessAnalyst ${TAG#v}" \
            --notes "ChessAnalyst-arm64-v8a.apk: Android (arm64-v8a). ChessAnalyst-web.zip: the web app (WebAssembly; serve the folder over HTTP)."
