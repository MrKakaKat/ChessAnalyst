name: chessanalyst
description: "ChessAnalyst: idea-first game analysis (analysis core ported from Python)."
publish_to: 'none'
version: 1.2.0+1000

environment:
  sdk: ^3.13.7

dependencies:
  chessground: ^11.0.0
  dartchess: ^0.14.0
  flutter:
    sdk: flutter
  multistockfish: ^0.6.1
  shared_preferences: ^2.5.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/games/
    - assets/openings_book.json
    - assets/openings_weights.json
    - assets/docs/analysis_guide.md
